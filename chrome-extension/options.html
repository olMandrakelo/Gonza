<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>PromptCraft - Opciones</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 480px;
        margin: 40px auto;
        padding: 0 16px;
        color: #1a1a1a;
      }
      h1 {
        font-size: 18px;
      }
      label {
        display: block;
        font-size: 13px;
        margin-bottom: 4px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 8px;
        font-size: 13px;
        border: 1px solid #ccc;
        border-radius: 6px;
      }
      button {
        margin-top: 12px;
        padding: 8px 16px;
        font-size: 13px;
        border-radius: 6px;
        border: none;
        background: #7c3aed;
        color: #fff;
        cursor: pointer;
      }
      #status {
        margin-left: 10px;
        font-size: 13px;
        color: #16a34a;
      }
      p.hint {
        font-size: 12px;
        color: #666;
      }
    </style>
  </head>
  <body>
    <h1>PromptCraft - Configuración</h1>
    <label for="apiKey">API key de Anthropic (Claude)</label>
    <input type="password" id="apiKey" placeholder="sk-ant-..." autocomplete="off" />
    <p class="hint">
      Se guarda solo en tu navegador (chrome.storage.local) y se usa para
      llamar a la API de Claude directamente desde la extensión. Conseguí una
      key en console.anthropic.com.
    </p>
    <button id="save">Guardar</button>
    <span id="status"></span>
    <script src="options.js"></script>
  </body>
</html>
